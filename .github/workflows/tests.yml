name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest flake8
      - name: Lint (warnings fail the build)
        run: flake8 --max-line-length=100 .
      - name: Run tests
        run: pytest -v
